<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#fef3c7"/>
  <!-- Mặt bàn gỗ tĩnh vật -->
  <rect x="0" y="160" width="240" height="80" fill="#d97706" opacity="0.35"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#b45309" stroke-width="3"/>
  <!-- Bình hoa gốm -->
  <path d="M100 130 Q90 180 105 195 Q120 200 135 195 Q150 180 140 130 Z" fill="#38bdf8"/>
  <ellipse cx="120" cy="130" rx="20" ry="6" fill="#0284c7"/>
  <ellipse cx="120" cy="130" rx="14" ry="4" fill="#0369a1"/>
  <!-- Cành hoa -->
  <line x1="120" y1="130" x2="105" y2="85" stroke="#15803d" stroke-width="3"/>
  <line x1="120" y1="130" x2="135" y2="80" stroke="#15803d" stroke-width="3"/>
  <line x1="120" y1="130" x2="120" y2="65" stroke="#15803d" stroke-width="3"/>
  <!-- Bông hoa cúc vàng giữa -->
  <circle cx="120" cy="65" r="9" fill="#f59e0b"/>
  <circle cx="120" cy="50" r="7" fill="#fbbf24"/>
  <circle cx="120" cy="80" r="7" fill="#fbbf24"/>
  <circle cx="105" cy="65" r="7" fill="#fbbf24"/>
  <circle cx="135" cy="65" r="7" fill="#fbbf24"/>
  <!-- Bông hoa hồng bên trái -->
  <circle cx="105" cy="85" r="14" fill="#f43f5e"/>
  <circle cx="105" cy="85" r="8" fill="#fda4af"/>
  <!-- Bông hoa tím bên phải -->
  <circle cx="135" cy="80" r="13" fill="#a855f7"/>
  <circle cx="135" cy="80" r="7" fill="#e9d5ff"/>
</svg>